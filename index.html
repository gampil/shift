<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shift Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #f8fafc; /* Warna latar terang yang lembut */
      color: #0f172a;
      min-height: 100vh;
    }
    
    /* Animasi muncul */
    .animate-fade-in {
      animation: fadeIn 0.4s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Kustomisasi input date/month agar lebih rapi */
    ::-webkit-calendar-picker-indicator { 
      cursor: pointer;
      opacity: 0.6;
      transition: 0.2s;
    }
    ::-webkit-calendar-picker-indicator:hover {
      opacity: 1;
    }
  </style>
</head>
<body class="p-3 md:p-8">

  <div class="max-w-5xl mx-auto space-y-5 md:space-y-6">
    <!-- Header -->
    <header class="bg-white rounded-2xl md:rounded-3xl p-5 md:p-6 flex flex-col md:flex-row justify-between items-center gap-3 shadow-sm border border-slate-200">
      <div class="text-center md:text-left">
        <h1 class="text-2xl font-extrabold tracking-tight text-slate-800 italic">SHIFT TRACKER</h1>
        <p class="text-blue-600 text-xs font-bold uppercase tracking-widest mt-1">Personal Schedule</p>
      </div>
      <div class="text-center md:text-right border-t md:border-t-0 md:border-l border-slate-200 pt-3 md:pt-0 md:pl-6 w-full md:w-auto">
        <p id="liveClock" class="text-xl md:text-2xl font-bold text-slate-800"></p>
        <p class="text-[10px] text-slate-400 font-semibold uppercase tracking-widest mt-1">Waktu Sistem</p>
      </div>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-5 md:gap-6">
      
      <!-- Panel Konfigurasi -->
      <section class="lg:col-span-1 space-y-6">
        <div class="bg-white rounded-2xl md:rounded-3xl p-5 md:p-6 shadow-sm border border-slate-200">
          <h2 class="text-base md:text-lg font-bold mb-5 flex items-center gap-2 text-slate-800">
            <span class="p-1.5 bg-blue-100 rounded-lg text-sm text-blue-600">⚙️</span> KONFIGURASI
          </h2>
          <div class="space-y-5">
            <div>
              <label class="text-[11px] font-bold uppercase tracking-widest text-slate-500 mb-2 block">Status Shift Hari Ini</label>
              <select id="startShift" class="w-full p-3.5 md:p-4 rounded-xl bg-slate-50 border border-slate-200 text-slate-800 font-semibold outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all text-sm">
                <option value="0">Shift 1 (Hari 1)</option>
                <option value="1">Shift 1 (Hari 2)</option>
                <option value="2">Shift 2 (Hari 1)</option>
                <option value="3">Shift 2 (Hari 2)</option>
                <option value="4">Shift 3 (Hari 1)</option>
                <option value="5">Shift 3 (Hari 2)</option>
                <option value="6">Libur (Hari 1)</option>
                <option value="7">Libur (Hari 2)</option>
              </select>
            </div>
            <div>
              <label class="text-[11px] font-bold uppercase tracking-widest text-slate-500 mb-2 block">Sampai Bulan Apa?</label>
              <input type="month" id="untilMonth" class="w-full p-3.5 md:p-4 rounded-xl bg-slate-50 border border-slate-200 text-slate-800 font-semibold outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all text-sm">
            </div>
            <button onclick="generateJadwal()" class="w-full bg-blue-600 hover:bg-blue-700 transition-all py-3.5 md:py-4 rounded-xl font-extrabold text-xs md:text-sm tracking-widest text-white shadow-lg shadow-blue-500/30 active:scale-95">
              TAMPILKAN JADWAL
            </button>
          </div>
        </div>
      </section>

      <!-- Panel Kalender -->
      <section class="lg:col-span-2">
        <div id="calendarContainer" class="bg-white rounded-2xl md:rounded-3xl p-4 md:p-6 shadow-sm border border-slate-200 hidden min-h-[400px]">
          <div id="calendarList" class="space-y-8">
            <!-- Kalender akan dirender di sini -->
          </div>
        </div>
        
        <!-- Placeholder sebelum generate -->
        <div id="placeholder" class="bg-white rounded-2xl md:rounded-3xl p-12 md:p-16 flex flex-col items-center justify-center text-center shadow-sm border border-slate-200 min-h-[400px]">
           <div class="w-20 h-20 bg-blue-50 text-blue-500 rounded-full flex items-center justify-center mb-5">
             <span class="text-4xl">🗓️</span>
           </div>
           <p class="text-slate-500 font-semibold max-w-xs text-sm">Silakan isi konfigurasi shift hari ini dan pilih target bulan untuk menampilkan kalender.</p>
        </div>
      </section>
    </div>
  </div>

  <script>
    // Jam Real-time
    setInterval(() => {
      document.getElementById('liveClock').innerText = new Date().toLocaleTimeString('id-ID', { hour12: false });
    }, 1000);

    function generateJadwal() {
      const startIndex = parseInt(document.getElementById('startShift').value);
      const untilInput = document.getElementById('untilMonth').value;
      
      if(!untilInput) return alert("Pilih bulan target terlebih dahulu!");

      document.getElementById('calendarContainer').classList.remove('hidden');
      document.getElementById('placeholder').classList.add('hidden');
      
      const list = document.getElementById('calendarList');
      list.innerHTML = '';

      // Tentukan hari ini dan bersihkan jamnya untuk akurasi perhitungan selisih hari
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      
      const parts = untilInput.split('-');
      const endYear = parseInt(parts[0]);
      const endMonth = parseInt(parts[1]) - 1;
      
      const shiftPattern = ["S1", "S1", "S2", "S2", "S3", "S3", "OFF", "OFF"];
      const namaBulan = ["JANUARI", "FEBRUARI", "MARET", "APRIL", "MEI", "JUNI", "JULI", "AGUSTUS", "SEPTEMBER", "OKTOBER", "NOVEMBER", "DESEMBER"];
      
      let currentMonth = today.getMonth();
      let currentYear = today.getFullYear();

      // Loop dari bulan ini sampai bulan yang dipilih
      while (currentYear < endYear || (currentYear === endYear && currentMonth <= endMonth)) {
        
        const monthSection = document.createElement('div');
        monthSection.className = "animate-fade-in";
        monthSection.innerHTML = `
          <h3 class="text-lg md:text-xl font-extrabold mb-4 text-slate-800 flex items-center gap-3">
            <span class="w-1.5 h-6 bg-blue-500 rounded-full"></span>
            ${namaBulan[currentMonth]} ${currentYear}
          </h3>
          <div class="grid grid-cols-7 gap-1 md:gap-2 mb-2 text-center">
            <div class="text-red-500 font-bold text-[9px] md:text-[11px] tracking-widest">MIN</div>
            <div class="text-slate-400 font-bold text-[9px] md:text-[11px] tracking-widest">SEN</div>
            <div class="text-slate-400 font-bold text-[9px] md:text-[11px] tracking-widest">SEL</div>
            <div class="text-slate-400 font-bold text-[9px] md:text-[11px] tracking-widest">RAB</div>
            <div class="text-slate-400 font-bold text-[9px] md:text-[11px] tracking-widest">KAM</div>
            <div class="text-slate-400 font-bold text-[9px] md:text-[11px] tracking-widest">JUM</div>
            <div class="text-slate-400 font-bold text-[9px] md:text-[11px] tracking-widest">SAB</div>
          </div>
          <div id="grid-${currentMonth}-${currentYear}" class="grid grid-cols-7 gap-1 md:gap-2"></div>
        `;
        list.appendChild(monthSection);
        
        const grid = document.getElementById(`grid-${currentMonth}-${currentYear}`);
        const firstDay = new Date(currentYear, currentMonth, 1).getDay();
        const lastDate = new Date(currentYear, currentMonth + 1, 0).getDate();

        // Tambahkan kotak kosong untuk awal bulan
        for(let i=0; i<firstDay; i++) {
          grid.innerHTML += `<div class="p-2"></div>`;
        }

        // Loop untuk setiap hari dalam bulan tersebut
        for (let d = 1; d <= lastDate; d++) {
          const targetDate = new Date(currentYear, currentMonth, d);
          
          // Hitung selisih hari dari hari ini
          const diffTime = targetDate.getTime() - today.getTime();
          const diffDays = Math.round(diffTime / (1000 * 3600 * 24));
          
          // Hitung index shift dengan modulo yang aman untuk angka negatif (masa lalu)
          let shiftIdx = ((startIndex + diffDays) % 8 + 8) % 8;
          const shift = shiftPattern[shiftIdx];
          
          const isOff = shift === "OFF";
          const isToday = today.toDateString() === targetDate.toDateString();
          const isSunday = targetDate.getDay() === 0;

          // Styling
          let bgClass = 'bg-slate-50 border-slate-100';
          let dateColor = isSunday ? 'text-red-500' : 'text-slate-700';
          let shiftBadge = 'bg-slate-200 text-slate-600';

          if (isOff) {
            bgClass = 'bg-red-50 border-red-100';
            dateColor = 'text-red-600';
            shiftBadge = 'bg-red-500 text-white shadow-sm shadow-red-500/30';
          } else if (isToday) {
            bgClass = 'bg-blue-50 border-blue-200 ring-2 ring-blue-500 ring-offset-1';
            dateColor = 'text-blue-700';
            shiftBadge = 'bg-blue-600 text-white shadow-sm shadow-blue-600/30';
          } else {
            shiftBadge = 'bg-slate-200 text-slate-700'; // S1, S2, S3 normal
          }

          grid.innerHTML += `
            <div class="relative p-1 md:p-2 rounded-xl border ${bgClass} flex flex-col items-center justify-center aspect-[4/5] md:aspect-auto md:min-h-[75px] transition-all hover:-translate-y-0.5">
              <span class="text-sm md:text-lg font-extrabold ${dateColor} leading-none mb-1 md:mb-1.5">${d}</span>
              <span class="text-[8px] md:text-[10px] font-black uppercase tracking-widest px-1.5 md:px-2 py-0.5 md:py-1 rounded ${shiftBadge}">
                ${shift}
              </span>
              ${isToday ? '<span class="absolute -top-2 -right-1 md:-top-2 md:-right-2 bg-blue-600 text-white text-[7px] md:text-[9px] px-1.5 py-0.5 font-bold rounded-full shadow-md">HARI INI</span>' : ''}
            </div>
          `;
        }

        // Pindah ke bulan berikutnya
        currentMonth++;
        if (currentMonth > 11) {
          currentMonth = 0;
          currentYear++;
        }
      }
    }
  </script>
</body>
</html>
