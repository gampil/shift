<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: radial-gradient(circle at top left, #1e293b, #0f172a);
      min-height: 100vh;
      color: #f8fafc;
    }
    .glass {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .input-glass {
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    ::-webkit-calendar-picker-indicator { filter: invert(1); }
    
    /* Animasi muncul */
    .animate-fade-in {
      animation: fadeIn 0.5s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="p-4 md:p-8">

  <div class="max-w-5xl mx-auto space-y-6">
    <header class="glass rounded-3xl p-6 flex flex-col md:flex-row justify-between items-center gap-4">
      <div>
        <h1 class="text-2xl font-extrabold tracking-tight text-white italic">SHIFT TRACKER</h1>
        <p class="text-indigo-400 text-sm font-semibold uppercase tracking-widest">Personal Schedule</p>
      </div>
      <div class="text-right hidden md:block border-l border-white/10 pl-6">
        <p id="liveClock" class="text-2xl font-bold text-white"></p>
        <p class="text-[10px] opacity-40 uppercase tracking-tighter">Automatic System</p>
      </div>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      
      <section class="lg:col-span-1 space-y-6">
        <div class="glass rounded-3xl p-6 shadow-2xl">
          <h2 class="text-lg font-bold mb-5 flex items-center gap-2">
            <span class="p-1.5 bg-indigo-500 rounded-lg text-sm text-white">⚙️</span> KONFIGURASI
          </h2>
          <div class="space-y-4">
            <div>
              <label class="text-[10px] font-bold uppercase tracking-widest text-indigo-300 mb-1.5 block">Status Shift Hari Ini</label>
              <select id="startShift" class="w-full p-4 rounded-2xl input-glass text-white font-semibold outline-none focus:ring-2 ring-indigo-500">
                <option value="0" class="bg-slate-900">Shift 1 (Hari 1)</option>
                <option value="1" class="bg-slate-900">Shift 1 (Hari 2)</option>
                <option value="2" class="bg-slate-900">Shift 2 (Hari 1)</option>
                <option value="3" class="bg-slate-900">Shift 2 (Hari 2)</option>
                <option value="4" class="bg-slate-900">Shift 3 (Hari 1)</option>
                <option value="5" class="bg-slate-900">Shift 3 (Hari 2)</option>
                <option value="6" class="bg-slate-900">Libur (Hari 1)</option>
                <option value="7" class="bg-slate-900">Libur (Hari 2)</option>
              </select>
            </div>
            <div>
              <label class="text-[10px] font-bold uppercase tracking-widest text-indigo-300 mb-1.5 block">Sampai Bulan Apa?</label>
              <input type="month" id="untilMonth" class="w-full p-4 rounded-2xl input-glass text-white font-semibold outline-none">
            </div>
            <button onclick="generateJadwal()" class="w-full bg-indigo-600 hover:bg-indigo-500 transition-all py-4 rounded-2xl font-extrabold text-sm tracking-widest shadow-xl shadow-indigo-500/20 active:scale-95">
              GENERATE JADWAL
            </button>
          </div>
        </div>
      </section>

      <section class="lg:col-span-2">
        <div id="calendarContainer" class="glass rounded-3xl p-6 hidden min-h-[400px]">
          <div id="calendarList" class="space-y-10">
            </div>
        </div>
        
        <div id="placeholder" class="glass rounded-3xl p-16 flex flex-col items-center justify-center text-center">
           <div class="w-20 h-20 bg-indigo-500/10 rounded-full flex items-center justify-center mb-4">
             <span class="text-4xl">🗓️</span>
           </div>
           <p class="text-white/40 font-semibold italic">Silakan isi konfigurasi untuk menampilkan kalender.</p>
        </div>
      </section>
    </div>
  </div>

  <script>
    setInterval(() => {
      document.getElementById('liveClock').innerText = new Date().toLocaleTimeString('id-ID');
    }, 1000);

    function generateJadwal() {
      const startIndex = parseInt(document.getElementById('startShift').value);
      const untilInput = document.getElementById('untilMonth').value;
      
      if(!untilInput) return alert("Pilih bulan dulu!");

      document.getElementById('calendarContainer').classList.remove('hidden');
      document.getElementById('placeholder').classList.add('hidden');
      
      const list = document.getElementById('calendarList');
      list.innerHTML = '';

      const today = new Date();
      let dateCursor = new Date(today.getFullYear(), today.getMonth(), today.getDate());
      
      const parts = untilInput.split('-');
      const endCalendar = new Date(parts[0], parts[1], 0); 
      
      const shiftPattern = ["S1", "S1", "S2", "S2", "S3", "S3", "OFF", "OFF"];
      const namaBulan = ["JANUARI", "FEBRUARI", "MARET", "APRIL", "MEI", "JUNI", "JULI", "AGUSTUS", "SEPTEMBER", "OKTOBER", "NOVEMBER", "DESEMBER"];
      
      let currentShiftIdx = startIndex;

      while (dateCursor <= endCalendar) {
        let month = dateCursor.getMonth();
        let year = dateCursor.getFullYear();

        const monthSection = document.createElement('div');
        monthSection.className = "animate-fade-in";
        monthSection.innerHTML = `
          <h3 class="text-xl font-extrabold mb-4 text-indigo-400 flex items-center gap-3">
            <span class="w-1.5 h-6 bg-indigo-500 rounded-full"></span>
            ${namaBulan[month]} ${year}
          </h3>
          <div class="grid grid-cols-7 gap-2 mb-2 text-center">
            <div class="text-red-400 font-bold text-[10px]">MIN</div>
            <div class="opacity-40 font-bold text-[10px]">SEN</div>
            <div class="opacity-40 font-bold text-[10px]">SEL</div>
            <div class="opacity-40 font-bold text-[10px]">RAB</div>
            <div class="opacity-40 font-bold text-[10px]">KAM</div>
            <div class="opacity-40 font-bold text-[10px]">JUM</div>
            <div class="opacity-40 font-bold text-[10px]">SAB</div>
          </div>
          <div id="grid-${month}-${year}" class="grid grid-cols-7 gap-2"></div>
        `;
        list.appendChild(monthSection);
        
        const grid = document.getElementById(`grid-${month}-${year}`);
        const firstDay = new Date(year, month, 1).getDay();
        for(let i=0; i<firstDay; i++) grid.innerHTML += `<div></div>`;

        while (dateCursor.getMonth() === month && dateCursor <= endCalendar) {
          const shift = shiftPattern[currentShiftIdx % 8];
          const isOff = shift === "OFF";
          const isToday = new Date().toDateString() === dateCursor.toDateString();

          // Penyesuaian Style: Angka tanggal dibuat besar dan tebal
          const bgClass = isOff ? 'bg-red-500/30 border-red-500/40 shadow-inner' : 'bg-white/5 border-white/10 shadow-sm';
          const dateColor = isOff ? 'text-red-100' : 'text-white';
          const shiftColor = isOff ? 'text-red-300' : 'text-indigo-300';

          grid.innerHTML += `
            <div class="relative p-2 rounded-xl border ${bgClass} flex flex-col items-center justify-center min-h-[70px] ${isToday ? 'ring-2 ring-white border-transparent' : ''}">
              <span class="text-lg font-extrabold ${dateColor}">${dateCursor.getDate()}</span>
              <span class="text-[11px] font-black uppercase tracking-tighter ${shiftColor}">${shift}</span>
              ${isToday ? '<span class="absolute -top-1 -right-1 bg-white text-indigo-900 text-[8px] px-1 font-bold rounded shadow-lg">NOW</span>' : ''}
            </div>
          `;

          dateCursor.setDate(dateCursor.getDate() + 1);
          currentShiftIdx++;
        }
      }
    }
  </script>
</body>
</html>
