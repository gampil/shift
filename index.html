<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Shift Tracker App</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #e2e8f0; /* Latar desktop (abu-abu) */
      margin: 0;
      display: flex;
      justify-content: center;
    }
    
    /* Container pembatas untuk simulasi layar HP di desktop */
    .app-container {
      width: 100%;
      max-width: 420px; /* Ukuran standar HP */
      min-height: 100vh;
      background-color: #f8fafc;
      position: relative;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      display: flex;
      flex-direction: column;
    }

    .animate-fade-in {
      animation: fadeIn 0.3s ease-out forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Kustomisasi input Android style */
    select, input[type="month"] {
      -webkit-appearance: none;
      background-image: none;
    }
    ::-webkit-calendar-picker-indicator { 
      opacity: 0.5;
    }
    
    /* Sembunyikan scrollbar untuk tampilan lebih bersih */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body>

  <div class="app-container">
    
    <!-- Top App Bar (Android Style) -->
    <header class="bg-blue-600 text-white sticky top-0 z-50 shadow-md">
      <div class="px-5 py-4 flex justify-between items-center">
        <div>
          <h1 class="text-lg font-bold tracking-wide">Shift Tracker</h1>
          <p class="text-[11px] text-blue-200 font-medium mt-0.5" id="liveClock">Memuat waktu...</p>
        </div>
        <div class="w-9 h-9 bg-white/20 rounded-full flex items-center justify-center backdrop-blur-sm">
          <span class="text-lg">📅</span>
        </div>
      </div>
    </header>

    <!-- Scrollable Content Area -->
    <main class="flex-1 overflow-y-auto no-scrollbar p-4 pb-28 space-y-4">
      
      <!-- Card Konfigurasi -->
      <section class="bg-white rounded-2xl p-5 shadow-sm border border-slate-100">
        <h2 class="text-sm font-bold text-slate-800 mb-4 flex items-center gap-2">
          <span class="text-blue-600">⚙️</span> Pengaturan Jadwal
        </h2>
        
        <div class="space-y-4">
          <!-- Material-like Input Field -->
          <div class="relative">
            <label class="text-[10px] font-bold uppercase text-slate-500 mb-1.5 block">Shift Hari Ini</label>
            <div class="relative bg-slate-50 border border-slate-200 rounded-xl flex items-center px-3">
              <select id="startShift" class="w-full py-3.5 bg-transparent text-slate-700 font-semibold text-sm outline-none">
                <option value="0">Shift 1 (Hari 1)</option>
                <option value="1">Shift 1 (Hari 2)</option>
                <option value="2">Shift 2 (Hari 1)</option>
                <option value="3">Shift 2 (Hari 2)</option>
                <option value="4">Shift 3 (Hari 1)</option>
                <option value="5">Shift 3 (Hari 2)</option>
                <option value="6">Libur (Hari 1)</option>
                <option value="7">Libur (Hari 2)</option>
              </select>
              <span class="absolute right-4 text-slate-400 pointer-events-none">▼</span>
            </div>
          </div>

          <div class="relative">
            <label class="text-[10px] font-bold uppercase text-slate-500 mb-1.5 block">Target Bulan</label>
            <input type="month" id="untilMonth" class="w-full p-3.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-700 font-semibold text-sm outline-none focus:border-blue-500">
          </div>
        </div>
      </section>

      <!-- Placeholder -->
      <div id="placeholder" class="bg-transparent py-10 flex flex-col items-center justify-center text-center">
         <div class="w-16 h-16 bg-slate-200/50 text-slate-400 rounded-full flex items-center justify-center mb-3">
           <span class="text-2xl">🔍</span>
         </div>
         <p class="text-slate-400 text-xs font-medium max-w-[200px]">Atur konfigurasi di atas dan tekan tombol generate.</p>
      </div>

      <!-- Container Kalender -->
      <div id="calendarList" class="space-y-5">
        <!-- Kalender masuk ke sini -->
      </div>
      
    </main>

    <!-- Sticky Bottom Navigation / Action Button -->
    <div class="fixed bottom-0 w-full max-w-[420px] bg-white border-t border-slate-200 p-4 pb-safe z-50">
      <button onclick="generateJadwal()" class="w-full bg-blue-600 hover:bg-blue-700 transition-colors py-3.5 rounded-xl font-bold text-sm tracking-wide text-white shadow-lg shadow-blue-600/30 active:scale-95 flex justify-center items-center gap-2">
        <span>GENERATE JADWAL</span>
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
      </button>
    </div>

  </div>

  <script>
    // Update Jam Real-time
    setInterval(() => {
      const now = new Date();
      const timeString = now.toLocaleTimeString('id-ID', { hour12: false, hour: '2-digit', minute: '2-digit' });
      const dateString = now.toLocaleDateString('id-ID', { weekday: 'short', day: 'numeric', month: 'short' });
      document.getElementById('liveClock').innerText = `${dateString} • ${timeString}`;
    }, 1000);

    function generateJadwal() {
      const startIndex = parseInt(document.getElementById('startShift').value);
      const untilInput = document.getElementById('untilMonth').value;
      
      if(!untilInput) return alert("Pilih target bulan terlebih dahulu!");

      document.getElementById('placeholder').classList.add('hidden');
      
      const list = document.getElementById('calendarList');
      list.innerHTML = '';

      const today = new Date();
      today.setHours(0, 0, 0, 0);
      
      const parts = untilInput.split('-');
      const endYear = parseInt(parts[0]);
      const endMonth = parseInt(parts[1]) - 1;
      
      const shiftPattern = ["S1", "S1", "S2", "S2", "S3", "S3", "OFF", "OFF"];
      const namaBulan = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
      
      let currentMonth = today.getMonth();
      let currentYear = today.getFullYear();

      while (currentYear < endYear || (currentYear === endYear && currentMonth <= endMonth)) {
        
        // Card per bulan ala Android
        const monthSection = document.createElement('div');
        monthSection.className = "bg-white rounded-2xl p-4 shadow-sm border border-slate-100 animate-fade-in";
        monthSection.innerHTML = `
          <h3 class="text-base font-bold mb-4 text-slate-800 ml-1">
            ${namaBulan[currentMonth]} ${currentYear}
          </h3>
          <div class="grid grid-cols-7 gap-y-3 gap-x-1 text-center mb-2">
            <div class="text-red-500 font-bold text-[10px]">MIN</div>
            <div class="text-slate-400 font-bold text-[10px]">SEN</div>
            <div class="text-slate-400 font-bold text-[10px]">SEL</div>
            <div class="text-slate-400 font-bold text-[10px]">RAB</div>
            <div class="text-slate-400 font-bold text-[10px]">KAM</div>
            <div class="text-slate-400 font-bold text-[10px]">JUM</div>
            <div class="text-slate-400 font-bold text-[10px]">SAB</div>
          </div>
          <div id="grid-${currentMonth}-${currentYear}" class="grid grid-cols-7 gap-y-3 gap-x-1 text-center"></div>
        `;
        list.appendChild(monthSection);
        
        const grid = document.getElementById(`grid-${currentMonth}-${currentYear}`);
        const firstDay = new Date(currentYear, currentMonth, 1).getDay();
        const lastDate = new Date(currentYear, currentMonth + 1, 0).getDate();

        // Kotak kosong awal bulan
        for(let i=0; i<firstDay; i++) {
          grid.innerHTML += `<div></div>`;
        }

        // Render hari
        for (let d = 1; d <= lastDate; d++) {
          const targetDate = new Date(currentYear, currentMonth, d);
          const diffTime = targetDate.getTime() - today.getTime();
          const diffDays = Math.round(diffTime / (1000 * 3600 * 24));
          
          let shiftIdx = ((startIndex + diffDays) % 8 + 8) % 8;
          const shift = shiftPattern[shiftIdx];
          
          const isOff = shift === "OFF";
          const isToday = today.toDateString() === targetDate.toDateString();
          const isSunday = targetDate.getDay() === 0;

          // Desain Google Calendar style (angka dalam lingkaran bulat jika hari ini)
          let dateStyle = isSunday ? 'text-red-500' : 'text-slate-700';
          let dateBg = 'bg-transparent';
          let shiftStyle = 'bg-slate-100 text-slate-500';

          if (isToday) {
            dateBg = 'bg-blue-600';
            dateStyle = 'text-white font-bold shadow-md shadow-blue-500/40';
          }

          if (isOff) {
            shiftStyle = 'bg-red-100 text-red-600 font-bold';
            if (!isToday && !isSunday) dateStyle = 'text-red-500'; 
          } else if (isToday) {
            shiftStyle = 'bg-blue-100 text-blue-700 font-bold';
          } else {
            shiftStyle = 'bg-slate-100 text-slate-600 font-semibold';
          }

          grid.innerHTML += `
            <div class="flex flex-col items-center justify-start gap-1">
              <div class="w-8 h-8 flex items-center justify-center rounded-full text-sm font-medium ${dateBg} ${dateStyle} transition-transform active:scale-90">
                ${d}
              </div>
              <span class="text-[9px] px-2 py-0.5 rounded-full tracking-wide ${shiftStyle}">
                ${shift}
              </span>
            </div>
          `;
        }

        currentMonth++;
        if (currentMonth > 11) {
          currentMonth = 0;
          currentYear++;
        }
      }
      
      // Scroll sedikit ke bawah untuk melihat hasil
      setTimeout(() => {
        window.scrollBy({ top: 150, behavior: 'smooth' });
      }, 100);
    }
  </script>
</body>
</html>
